<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="trailixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Logo Icon: Intersecting Trails / Compass Pin -->
  <g transform="translate(4, 4)">
    <circle cx="28" cy="28" r="26" fill="#0F172A" stroke="url(#trailixGrad)" stroke-width="2.5" />
    <!-- Overlapping paths representing two travelers meeting -->
    <path d="M16 38 C 20 22, 26 14, 38 18" stroke="url(#trailixGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#shadow)" />
    <path d="M40 38 C 36 24, 28 16, 18 20" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" fill="none" />
    <!-- Meeting point beacon pin -->
    <circle cx="28" cy="24" r="5" fill="#10B981" />
    <circle cx="28" cy="24" r="2" fill="#FFFFFF" />
    <path d="M28 29 L28 35" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Typography: Trailix -->
  <text x="74" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Trai<tspan fill="url(#trailixGrad)">lix</tspan>
  </text>
  
  <!-- Subtitle badge -->
  <text x="75" y="55" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
    EXPLORE TOGETHER
  </text>
</svg>
